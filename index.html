<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>دعوة خاصة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ SCREEN 1 : الدعوة (البطاقة) ============ -->
  <section id="screen-invite" class="screen screen--active">
    <img class="invite-bg" src="assets/invitation-bg.png" alt="دعوة خاصة">

    <!-- منطقة الضغط الشفافة فوق زر "افتح الدعوة" المرسوم على الصورة -->
    <button id="btn-open" class="tap-zone" aria-label="افتح الدعوة">
      <span class="tap-zone__ring"></span>
      <span class="tap-zone__ring tap-zone__ring--delay"></span>
    </button>
  </section>

  <!-- ============ SCREEN 2 : الفيديو ============ -->
  <section id="screen-video" class="screen">
    <div class="video-stage">
      <video id="invite-video" playsinline webkit-playsinline preload="auto" poster="">
        <source src="assets/final.mp4" type="video/mp4">
        متصفحك لا يدعم تشغيل الفيديو.
      </video>


    </div>

    <div id="video-fallback" class="video-fallback">
      <p>تعذّر تحميل الفيديو</p>
      <button id="btn-fallback-continue" class="pill-btn">متابعة</button>
    </div>
  </section>

  <!-- ============ SCREEN 3 : الموقع ============ -->
  <section id="screen-location" class="screen">
    <img class="invite-bg invite-bg--dim" src="assets/invitation-bg.png" alt="">
    <div class="location-card">
      <span class="eyebrow">بكل الحب ندعوكم لمشاركتنا فرحتنا</span>
      <h1 class="location-title">بانتظاركم</h1>
      <a id="btn-location" class="pill-btn" href="https://maps.google.com/?q=قاعة البنفسج نادي شركة مدينة مصر للإسكان والتعمير" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/>
        </svg>
        <span>عرض الموقع</span>
      </a>
    </div>
  </section>

<script src="script.js"></script>
</body>
</html>
